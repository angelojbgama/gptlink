[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gptlink"
version = "0.1.0"
description = "Self-hosted, policy-enforced remote computer operations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GPTLink contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=14,<17",
  "anyio>=4,<5",
  "httpx>=0.28,<1",
  "mcp>=2.2,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "PyYAML>=6,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
gptlink = "gptlink.cli.main:app"
gptlink-agent = "gptlink.agent.__main__:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  # Starlette 1.6 TestClient compatibility shims; remove when upstream migrates.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning:fastapi.testclient",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/gptlink"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests"]
